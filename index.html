<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spare Parts Wholesale</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0c10;--panel:#14161c;--line:#262a33;--text:#f4f5f7;--mut:#9aa0ad;--y:#f5ff3d;--g:#55f09a;--r:#ff667d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'DM Sans',system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:#0b0c10ee;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}
.top b{font-size:17px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#1b1e26;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.p{background:var(--y);color:#111;border-color:var(--y)}.btn.d{color:var(--r)}.btn:disabled{opacity:.45}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:380px}
.card h2{margin:0 0 8px}.mut{color:var(--mut)}.err{color:var(--r);margin:10px 0 0;min-height:18px}
input{width:100%;background:#0e1015;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;background:#1b1e26;display:block}
.prod div{padding:12px}.price{font-weight:700;color:var(--y)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#1b1e26}.in{color:var(--g)}.out{color:var(--r)}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.tabs .btn.on{background:var(--y);color:#111}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:20}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:15;padding:18px;overflow:auto}
.hide{display:none!important}.mono{font-family:ui-monospace,monospace;letter-spacing:.06em}

.logo{font-family:'Space Grotesk';font-size:20px;letter-spacing:-.03em}.logo span{color:var(--y)}
body{background:radial-gradient(700px 400px at 10% -10%,#f5ff3d14,transparent 60%),var(--bg)}
.hero{padding:34px 0 8px}.hero h1{font:700 clamp(26px,6vw,42px)/1.1 'Space Grotesk';margin:0 0 10px;letter-spacing:-.03em}
.hero input{margin-top:14px;padding:14px;border-radius:14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:8px 15px;font-weight:600}.chip.on{background:var(--y);color:#111;border-color:var(--y)}
.prod{transition:.15s}.prod:hover{border-color:#4a4f5c}.pb{padding:12px!important;display:flex;flex-direction:column;gap:5px}.pn{font-weight:600;line-height:1.25;min-height:2.5em}.sm{font-size:12px}.price{font-size:18px}
.step{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.step .btn{padding:8px 16px}
.bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9;background:#1b1e26;border:1px solid #3a3f4b;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:auto;box-shadow:0 12px 40px #000a}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:520px}.panel h3{margin:0 0 4px}.row2{display:flex;gap:8px}
label.mut{display:block;margin-top:12px;font-size:13px}input[type=file]{padding:10px}

/* Professional UI polish: presentation only; application/Firebase logic is unchanged. */
:root{--bg:#080a0f;--panel:#11151d;--line:#252d3a;--text:#f4f7fb;--mut:#9aa7b8;--y:#eaff45;--g:#55e6a5;--r:#ff6b83}
body{background:radial-gradient(900px 500px at 8% -12%,#eaff4514,transparent 62%),radial-gradient(700px 440px at 100% 0%,#55e9ff0b,transparent 58%),var(--bg);letter-spacing:.005em}
.top{background:#080a0feF;backdrop-filter:blur(18px);border-bottom-color:#ffffff12;padding:14px clamp(14px,3vw,30px);box-shadow:0 8px 30px #0002}
.logo{font-size:22px!important;letter-spacing:-.06em!important}.logo span{color:var(--y)}
.wrap{max-width:1180px;padding-left:clamp(14px,3vw,28px);padding-right:clamp(14px,3vw,28px)}
.btn{border:1px solid #ffffff17;background:linear-gradient(180deg,#202633,#171c26);border-radius:12px;padding:11px 15px;transition:transform .16s,border-color .16s,filter .16s;box-shadow:0 3px 10px #0002}
.btn:hover{border-color:#eaff4570;transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn.p{background:linear-gradient(135deg,#f5ff66,var(--y));color:#10120a;border-color:#eaff45;box-shadow:0 5px 18px #eaff451c}.btn.d{background:#ff667d12}
.card,.panel,.prod,.drawer{background:linear-gradient(155deg,#151a24,#10131a);border-color:#ffffff13;box-shadow:0 16px 42px #0002}
.card{border-radius:22px;padding:26px}.panel{max-width:720px;border-radius:18px;padding:20px;margin-bottom:16px}
input,select{width:100%;background:#0b0e14;border:1px solid #ffffff19;color:var(--text);border-radius:12px;padding:13px 14px;outline:none;transition:border-color .16s,box-shadow .16s}
input:focus,select:focus{border-color:#eaff4590;box-shadow:0 0 0 3px #eaff4512}
input::placeholder{color:#788496}.hero{padding:clamp(30px,6vw,58px) 0 12px}.hero h1{letter-spacing:-.055em;line-height:1.04}.hero p{max-width:620px;line-height:1.65}
.hero input{max-width:650px;background:#111620;border-color:#ffffff19}.chips{padding:16px 0 6px;scrollbar-width:thin}.chip{border-color:#ffffff17;background:#121721}.chip.on,.tabs .btn.on{box-shadow:0 4px 16px #eaff4518}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}.prod{border-radius:18px;overflow:hidden}.prod:hover{border-color:#eaff4555;transform:translateY(-2px);box-shadow:0 16px 35px #0004}.prod img{background:#171d27}.pb{padding:15px!important;gap:8px}.pn{font-size:15px;min-height:2.6em}.price{font-size:19px}.tag{background:#eaff4512;color:#eaff9a;border:1px solid #eaff4520;padding:4px 9px}
.tabs{gap:8px;margin:22px 0 16px}.tabs .btn{padding:10px 14px}.scroll{border:1px solid #ffffff10;border-radius:14px;background:#10141b;padding:8px}table{min-width:600px;font-size:13px}th{color:#aeb9c8;font-weight:700;background:#ffffff05}td,th{padding:12px 10px;border-bottom-color:#ffffff0d}tr:last-child td{border-bottom:0}
.row2{gap:10px}.panel h3{font-size:18px;margin-bottom:8px}.panel input{margin-top:10px}.err{font-size:13px}.drawer{border-radius:22px 0 0 22px;padding:22px;box-shadow:-18px 0 60px #0006}.bar{background:#151b25ee;backdrop-filter:blur(16px);border-color:#ffffff20;border-radius:18px;box-shadow:0 14px 42px #0007}
@media(max-width:600px){.top{align-items:flex-start}.top .row{justify-content:flex-end}.top .btn{padding:9px 10px;font-size:13px}.hero{padding-top:30px}.panel{padding:15px}.row2>*{min-width:0}.drawer{border-radius:20px 20px 0 0;top:auto;max-height:92dvh;width:100%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,onSnapshot,serverTimestamp,getDocs,collection,query,orderBy,writeBatch,deleteDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== EDIT THESE ====== */
const firebaseConfig={apiKey:"AIzaSyD4ahz9H3-5kD7rfqowHt3CAPDCjuKbUv0",authDomain:"display-wala.firebaseapp.com",projectId:"display-wala",appId:"1:788299746317:web:6e37f2fbf512a2847b9944"};
const ADMINS=["ekamsinghlehal@gmail.com"];          // must match firestore.rules
/* ======================== */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),root=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs=p=>"₹"+(p/100).toLocaleString("en-IN");
const S={user:null,profile:null,products:[],cart:{},view:"store",tab:"products",unsub:null,adm:false};
const isAdmin=()=>S.adm;
const isOwner=()=>!!S.user&&S.user.emailVerified&&ADMINS.includes(S.user.email.toLowerCase());
const OFF=50,isShop=()=>!!S.profile&&(S.profile.type==="shop"||(!S.profile.type&&!!S.profile.shopCode)),sp=p=>isShop()?Math.round(p*(100-OFF)/100):p;
const priceHtml=p=>isShop()?`<div class="price">${rs(sp(p))} <s class="mut sm">${rs(p)}</s></div>`:`<div class="price">${rs(p)}</div>`;

onAuthStateChanged(auth,async u=>{
  S.unsub&&S.unsub();S.user=u;S.profile=null;S.adm=false;
  if(!u){const m=S.lm||"";S.lm="";return login(m)}
  root.innerHTML='<div class="center mut">Loading…</div>';
  if(u.emailVerified){const em=u.email.toLowerCase();S.adm=ADMINS.includes(em)||await getDoc(doc(db,"admins",em)).then(x=>x.exists()).catch(()=>false)}
  let ex;try{ex=await getDoc(doc(db,"users",u.uid))}catch(x){S.lm="Could not sign you in. Try again.";return signOut(auth)}
  if(!ex.exists()&&!isAdmin())return chooseType(u);
  startApp(u)});
function startApp(u){
  S.unsub&&S.unsub();
  S.unsub=onSnapshot(doc(db,"users",u.uid),s=>{
    S.profile=s.exists()?s.data():null;
    if(S.profile?.is_banned)return banned();
    if(S.profile||isAdmin())return shell();
    login("Could not load your account.")
  },()=>login("Could not load your account."))}

const fmtCode=e=>{let v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);e.target.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v};
function login(msg=""){root.innerHTML=`<div class="center"><div class="card"><h2>Spare Parts Wholesale</h2><p class="mut">Sign in to start shopping.</p>
<button class="btn p" id="g" style="width:100%;margin-top:14px">Login with Google</button><p class="err">${esc(msg)}</p></div></div>`;
 $("#g").onclick=async()=>{const err=$(".err");err.textContent="";
  try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code!=="auth/popup-closed-by-user")err.textContent="Login failed. Try again."}}}
// Shown once, right after the first Google login: shop owners enter their shop code, everyone else continues as a customer.
function chooseType(u,msg=""){root.innerHTML=`<div class="center"><div class="card"><h2>Welcome${u.displayName?", "+esc(u.displayName.split(" ")[0]):""}!</h2><p class="mut">Are you a shop owner? Enter your shop code to get 50% off on everything.</p>
<input id="c" class="mono" placeholder="Shop code XXXX-XXXX" maxlength="9" autocomplete="off" style="text-align:center;font-size:18px">
<button class="btn p" id="go" style="width:100%;margin-top:12px">Continue as shop owner</button>
<button class="btn" id="cu" style="width:100%;margin-top:10px;background:none">I'm not a shop owner, continue</button>
<button class="btn" id="so" style="width:100%;margin-top:10px;background:none;border:none" >Sign out</button><p class="err">${esc(msg)}</p></div></div>`;
 $("#c").oninput=fmtCode;$("#so").onclick=()=>signOut(auth);
 const run=async code=>{const err=$(".err");err.textContent="";$("#go").disabled=$("#cu").disabled=true;
  try{await makeProfile(u,code);startApp(u)}catch(x){$("#go").disabled=$("#cu").disabled=false;err.textContent=typeof x==="string"?x:"Something went wrong. Try again."}};
 $("#go").onclick=()=>{const c=$("#c").value;if(c.length<9)return $(".err").textContent="Enter the full 8-character shop code.";run(c)};
 $("#cu").onclick=()=>run("")}
async function makeProfile(u,code){
  const b=writeBatch(db);
  if(code){const ref=doc(db,"shopCodes",code),s=await getDoc(ref);
    if(!s.exists())throw"This shop code doesn't exist.";
    if(s.data().status!=="unused")throw"This code has already been used.";
    b.update(ref,{status:"used",usedBy:u.uid,usedByEmail:u.email,usedAt:serverTimestamp()})}
  b.set(doc(db,"users",u.uid),{uid:u.uid,email:u.email,displayName:u.displayName||"",shopCode:code||"",type:code?"shop":"customer",is_verified:true,is_banned:false,createdAt:serverTimestamp()});
  await b.commit()}

function banned(){root.innerHTML=`<div class="center"><div class="card" style="text-align:center"><h2 style="color:var(--r)">Your account has been suspended</h2><p class="mut">${esc(S.user.email)} can't place orders. Contact us to resolve this.</p><button class="btn" id="o">Sign out</button></div></div>`;$("#o").onclick=()=>signOut(auth)}


async function loadProducts(){const s=await getDocs(collection(db,"products"));S.products=s.docs.map(d=>({id:d.id,...d.data()}))}
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);

const ph=n=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='#1b1e26'/><text x='100' y='122' font-size='62' text-anchor='middle' fill='#f5ff3d' font-family='sans-serif' font-weight='700'>${esc((n||"?").slice(0,2).toUpperCase())}</text></svg>`);
const QS=new URLSearchParams(location.search),PAY=QS.get("pay"),PAYO=QS.get("o");if(PAY)history.replaceState(null,"",location.pathname);
function payMsg(){if(!PAY||S.pm)return;S.pm=1;
  const show=st=>{const ok=st==="success",pd=st==="pending";
    $("#dr").innerHTML=`<div class="drawer"><h2 class="${ok?"in":pd?"":"out"}">${ok?"Payment received ✓":pd?"Payment pending":"Payment not completed"}</h2><p class="mut">${ok?"Your order is confirmed. We will arrange delivery.":pd?"We have not received confirmation of your payment yet. If money was deducted, it will be confirmed automatically in a few minutes. You can also check again now.":"Your payment was not completed, so no order was placed. If money was deducted, it will be refunded by your bank, or contact us."}</p><div class="row">${pd&&PAYO?'<button class="btn p" id="ck">Check payment status</button>':""}<button class="btn" id="x">Close</button></div><p class="err" id="ce"></p></div>`;
    $("#x").onclick=()=>$("#dr").innerHTML="";
    const ck=$("#ck");ck&&(ck.onclick=async()=>{ck.disabled=true;ck.textContent="Checking…";
      try{const r=await fetch("/api/check-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:await auth.currentUser.getIdToken(true),orderId:PAYO})}),d=await r.json();if(!r.ok)throw d.error;show(d.status)}
      catch(x){ck.disabled=false;ck.textContent="Check payment status";$("#ce").textContent=typeof x==="string"?x:"Could not check. Try again."}})};
  show(PAY==="success"||PAY==="pending"?PAY:"failed");
  if(PAY==="pending"&&PAYO)setTimeout(()=>{const c=$("#ck");c&&c.click()},4000)}
async function shell(){
  try{await loadProducts()}catch{}
  root.innerHTML=`<div class="top"><b class="logo">Spare<span>Parts</span></b><div class="row">${isShop()?'<span class="tag in">Shop owner · 50% off</span>':""}${isAdmin()?'<button class="btn" id="va">Admin</button>':""}<button class="btn" id="vs">Store</button><button class="btn" id="o">Sign out</button></div></div><div class="wrap" id="main"></div><div id="bar"></div><div id="dr"></div>`;
  $("#o").onclick=()=>signOut(auth);$("#vs").onclick=()=>{S.view="store";render()};isAdmin()&&($("#va").onclick=()=>{S.view="admin";render()});render();payMsg()}
function render(){S.view==="admin"&&isAdmin()?admin():store();bar()}
function bar(){const n=cartCount(),t=Object.entries(S.cart).reduce((a,[id,q])=>a+q*sp(S.products.find(p=>p.id===id)?.price||0),0),on=n&&S.view==="store";
  $("#bar").innerHTML=on?`<div class="bar"><div><b>${n} item${n>1?"s":""}</b><div class="mut">${rs(t)}</div></div><button class="btn p" id="vc">View cart</button></div>`:"";on&&($("#vc").onclick=cart)}
function store(){
  const cats=[...new Set(S.products.map(p=>p.category).filter(Boolean))];
  $("#main").innerHTML=`<div class="hero"><h1>Genuine mobile spare parts,<br>wholesale rates</h1><p class="mut" style="margin:0">Displays, batteries, ports and more. Pay online and we arrange delivery.</p><input id="q" placeholder="Search parts…" value="${esc(S.q||"")}"></div>
  <div class="chips">${["All",...cats].map(c=>`<button class="chip ${(S.cat||"All")===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="gr"></div>`;
  $("#q").oninput=e=>{S.q=e.target.value;grid()};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;store()});grid()}
function grid(){
  const q=(S.q||"").toLowerCase(),c=S.cat&&S.cat!=="All"?S.cat:null,L=S.products.filter(p=>(!c||p.category===c)&&(!q||p.name.toLowerCase().includes(q)));
  $("#gr").innerHTML=L.length?`<div class="grid">${L.map(p=>{const n=S.cart[p.id]||0;return `<div class="prod"><img src="${esc(p.imageUrl||ph(p.name))}" alt="" loading="lazy"><div class="pb">${p.category?`<span class="tag" style="align-self:flex-start">${esc(p.category)}</span>`:""}<div class="pn">${esc(p.name)}</div>${priceHtml(p.price)}<div class="${p.stock>0?"in":"out"} sm">${p.stock>0?"In stock":"Out of stock"}</div>${p.stock<=0?'<button class="btn" disabled>Unavailable</button>':n?`<div class="step"><button class="btn" data-gm="${p.id}">−</button><b>${n}</b><button class="btn" data-gp="${p.id}">+</button></div>`:`<button class="btn p" data-ga="${p.id}">Add to cart</button>`}</div></div>`}).join("")}</div>`:`<p class="mut" style="margin:30px 0">${S.products.length?"No parts match your search.":"No products yet."+(isAdmin()?" Open Admin → Products to add some.":"")}</p>`;
  document.querySelectorAll("[data-ga],[data-gp]").forEach(b=>b.onclick=()=>{const id=b.dataset.ga||b.dataset.gp,p=S.products.find(x=>x.id===id);if((S.cart[id]||0)<p.stock)S.cart[id]=(S.cart[id]||0)+1;grid();bar()});
  document.querySelectorAll("[data-gm]").forEach(b=>b.onclick=()=>{const id=b.dataset.gm;S.cart[id]--;if(S.cart[id]<1)delete S.cart[id];grid();bar()})}

function cart(){S.sh=S.sh||{};
  const items=Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id===id),q})).filter(i=>i.p),total=items.reduce((a,i)=>a+sp(i.p.price)*i.q,0);
  $("#dr").innerHTML=`<div class="drawer"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Your cart</h2><button class="btn" id="x">Close</button></div>
  ${items.length?items.map(i=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div>${esc(i.p.name)}<div class="mut">${rs(sp(i.p.price))} × ${i.q}</div></div><div class="row"><button class="btn" data-m="${i.p.id}">−</button><button class="btn" data-pl="${i.p.id}">+</button></div></div>`).join("")+`
  <div class="row" style="justify-content:space-between"><span class="mut">Items</span><span>${rs(total)}</span></div><div class="row" id="dcr" style="justify-content:space-between;margin-top:6px;display:none"><span class="mut">Discount <span id="dct"></span></span><span id="dc" style="color:var(--g)"></span></div><div class="row" style="justify-content:space-between;margin-top:6px"><span class="mut">Delivery <span id="dk"></span></span><span id="dl">Enter pincode</span></div><h3 style="display:flex;justify-content:space-between"><span>Total</span><span id="tt">${rs(total)}</span></h3><div class="row" style="margin:12px 0 4px"><input id="cp" placeholder="Discount code" style="margin:0;flex:1;text-transform:uppercase" value="${esc(S.cpn||"")}"><button class="btn" id="ca">Apply</button></div><div class="mut" id="cm" style="font-size:13px;min-height:16px"></div><p class="mut">Delivery details (shipping is arranged offline)</p>
  <input id="n" placeholder="Contact name" value="${esc(S.sh.n||"")}"><input id="ph" placeholder="Phone" inputmode="tel" value="${esc(S.sh.ph||"")}"><input id="ad" placeholder="Full address" value="${esc(S.sh.ad||"")}"><input id="ci" placeholder="City" value="${esc(S.sh.ci||"")}"><input id="pi" placeholder="Pincode (6 digits)" inputmode="numeric" maxlength="6" value="${esc(S.sh.pi||"")}">
  <p class="err" id="e"></p><button class="btn p" id="pay" style="width:100%">Pay <span id="pt">${rs(total)}</span></button>`:'<p class="mut">Your cart is empty.</p>'}</div>`;
  $("#x").onclick=()=>$("#dr").innerHTML="";
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const id=b.dataset.m;S.cart[id]--;if(S.cart[id]<1)delete S.cart[id];render();cart()});
  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{const id=b.dataset.pl,p=S.products.find(x=>x.id===id);if(S.cart[id]<p.stock)S.cart[id]++;render();cart()});
  if(items.length){
    let dq=null,tk=0;
    const upd=m=>{const ch=dq&&!dq.nopin?dq.charge:0,ds=dq?dq.discount||0:0;
      $("#dl").textContent=m||(dq&&!dq.nopin?(dq.charge?rs(dq.charge):"FREE"):"Enter pincode");
      $("#dk").textContent=dq&&dq.km&&!dq.nopin?`(~${dq.km} km${dq.approx?", est.":""})`:"";
      $("#dcr").style.display=ds?"flex":"none";$("#dc").textContent="−"+rs(ds);$("#dct").textContent=ds?`(${dq.code} ${dq.percent}%)`:"";
      const t=total-ds+ch;$("#tt").textContent=rs(t);$("#pt").textContent=rs(t)};
    const getQ=async()=>{const my=++tk;upd("Calculating…");
      try{const r=await fetch("/api/delivery-quote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:await auth.currentUser.getIdToken(),pincode:$("#pi").value.trim(),coupon:S.cpn||"",items:items.map(i=>({id:i.p.id,qty:i.q}))})});const d=await r.json();if(!r.ok)throw d.error;if(my===tk){dq=d;if(d.couponError)S.cpn="";upd()}}
      catch(x){if(my===tk){dq=null;upd(typeof x==="string"?x:"Could not calculate")}}};
    ["n","ph","ad","ci","pi"].forEach(k=>$("#"+k).oninput=()=>{S.sh[k]=$("#"+k).value;if(k==="pi"){if($("#pi").value.trim().length===6)getQ();else if(dq){dq={...dq,nopin:true};upd()}}});
    $("#ca").onclick=async()=>{S.cpn=$("#cp").value.trim().toUpperCase();await getQ();$("#cm").textContent=dq&&dq.couponError?dq.couponError:(dq&&dq.discount?"Code applied ✓":"")};
    getQ().then(()=>{if(dq&&dq.discount)$("#cm").textContent="Code applied ✓"})}
  items.length&&($("#pay").onclick=async()=>{
    const sh={name:$("#n").value.trim(),phone:$("#ph").value.trim(),address:$("#ad").value.trim(),city:$("#ci").value.trim(),pincode:$("#pi").value.trim()};
    if(Object.values(sh).some(v=>!v))return $("#e").textContent="Fill in all delivery details.";
    const e=$("#e"),btn=$("#pay");btn.disabled=true;e.textContent="";
    const call=async(path,body)=>{const r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:await auth.currentUser.getIdToken(true),...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw d.error||"Something went wrong.";return d};
    try{const d=await call("create-order",{items:items.map(i=>({id:i.p.id,qty:i.q})),shipping:sh,coupon:S.cpn||""});
     const f=document.createElement("form");f.method="POST";f.action=d.action;for(const[k,v]of Object.entries(d.fields)){const i=document.createElement("input");i.type="hidden";i.name=k;i.value=v;f.appendChild(i)}document.body.appendChild(f);f.submit();
    }catch(x){e.textContent=typeof x==="string"?x:"Could not start payment. Try again.";btn.disabled=false}})}

function admin(){
  const T=[["products","Products"],["codes","Shop codes"],["users","Users"],["orders","Orders"],["delivery","Delivery"],["coupons","Discounts"],...(isOwner()?[["admins","Admins"]]:[])];
  $("#main").innerHTML=`<div class="tabs">${T.map(t=>`<button class="btn ${S.tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div><div id="ab" class="scroll">Loading…</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;admin()});
  ({codes:aCodes,users:aUsers,orders:aOrders,products:aProducts,admins:aAdmins,delivery:aDelivery,coupons:aCoupons})[S.tab]()}

const when=t=>t?.toDate?t.toDate().toLocaleString("en-IN"):"";
async function aCodes(){
  const snap=await getDocs(collection(db,"shopCodes")),rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $("#ab").innerHTML=`<div class="row"><input id="cn" type="number" min="1" max="50" value="1" style="width:90px;margin:0"><input id="nt" placeholder="Note (shop name)" style="max-width:240px;margin:0"><button class="btn p" id="gen">Generate</button></div>
  <table style="margin-top:14px"><tr><th>Code</th><th>Status</th><th>Used by</th><th></th></tr>${rows.map(c=>`<tr><td class="mono">${esc(c.code)}<div class="mut">${esc(c.note||"")}</div></td><td>${c.status}</td><td>${esc(c.usedByEmail||"")}</td><td><button class="btn" data-cp="${esc(c.code)}">Copy</button></td></tr>`).join("")}</table>`;
  $("#gen").onclick=async()=>{const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",n=Math.min(Math.max(+$("#cn").value||1,1),50);$("#gen").disabled=true;
   for(let i=0;i<n;i++){const r=crypto.getRandomValues(new Uint32Array(8)),s=[...r].map(x=>A[x%A.length]).join(""),code=s.slice(0,4)+"-"+s.slice(4);
    await setDoc(doc(db,"shopCodes",code),{code,status:"unused",note:$("#nt").value.trim(),createdAt:serverTimestamp(),usedBy:null,usedByEmail:null,usedAt:null})}aCodes()};
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.cp);b.textContent="Copied"})}

async function aUsers(){
  const snap=await getDocs(collection(db,"users")),rows=snap.docs.map(d=>d.data());
  $("#ab").innerHTML=`<table><tr><th>User</th><th>Shop code</th><th>Status</th><th></th></tr>${rows.map(u=>`<tr><td>${esc(u.displayName)}<div class="mut">${esc(u.email)}</div></td><td class="mono">${esc(u.shopCode)}</td><td class="${u.is_banned?"out":"in"}">${u.is_banned?"Banned":"Active"}</td>
  <td><button class="btn ${u.is_banned?"":"d"}" data-b="${u.uid}" data-v="${u.is_banned?0:1}">${u.is_banned?"Unban":"Ban"}</button></td></tr>`).join("")}</table>`;
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.b),{is_banned:b.dataset.v==="1"});aUsers()})}

async function aOrders(){
  const snap=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc"))),all=snap.docs.map(d=>({id:d.id,...d.data()})),rows=S.allOrd?all:all.filter(o=>o.paymentStatus==="PAID");
  $("#ab").innerHTML=rows.length?`<table><tr><th>Order</th><th>Items</th><th>Total</th><th>Payment</th><th>Ship to</th></tr>${rows.map(o=>`<tr><td>${o.id.slice(0,6)}<div class="mut">${when(o.createdAt)}</div><div class="mut mono">${esc(o.shopCode)}</div></td><td>${o.items.map(i=>esc(i.name)+" ×"+i.qty).join("<br>")}</td><td>${rs(o.amount)}${o.discount?`<div class="mut">coupon ${esc(o.couponCode)} −${rs(o.discount)}</div>`:""}<div class="mut">incl. delivery ${rs(o.shippingCharge||0)}<br>${o.distanceKm||0} km · ${((o.weightGrams||0)/1000).toFixed(1)} kg</div></td>
  <td class="${o.paymentStatus==="PAID"?"in":"out"}">${o.paymentStatus}<div class="mut">${esc(o.payuPaymentId||o.razorpayPaymentId||"")}</div></td><td>${esc(o.shipping.name)}, ${esc(o.shipping.phone)}<br>${esc(o.shipping.address)}, ${esc(o.shipping.city)} ${esc(o.shipping.pincode)}</td></tr>`).join("")}</table>`:'<p class="mut">No paid orders yet.</p>';
  $("#ab").insertAdjacentHTML("afterbegin",`<div class="row" style="margin-bottom:10px;justify-content:space-between"><b>${S.allOrd?"All orders":"Paid orders (ready to process)"}</b><button class="btn" id="tg">${S.allOrd?"Show only paid":"Show unpaid too"}</button></div>`);$("#tg").onclick=()=>{S.allOrd=!S.allOrd;aOrders()}}

const SAMPLES=[["iPhone 11 Display (OEM)","Displays",185000,20,200],["Samsung A12 Battery","Batteries",42000,50,60],["Type-C Charging Port Flex","Ports",9000,100,10],["Redmi Note 10 Back Glass","Back Glass",28000,30,40],["Tempered Glass 9H (pack of 10)","Accessories",15000,80,150],["Fast Charger 33W","Accessories",35000,40,120]];
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
async function aProducts(){
  await loadProducts();
  $("#ab").innerHTML=`<div class="panel"><h3>Add product</h3><input id="pn" placeholder="Product name"><div class="row2"><input id="pp" type="number" placeholder="Price ₹"><input id="ps" type="number" placeholder="Stock"></div><input id="pw" type="number" placeholder="Weight in grams (e.g. 200)"><input id="pc" list="cl" placeholder="Category (e.g. Displays)"><datalist id="cl">${[...new Set(S.products.map(p=>p.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label class="mut">Photo from gallery (optional)</label><input id="pf" type="file" accept="image/*"><p class="err" id="pe"></p><button class="btn p" id="add">Add product</button>${S.products.length?"":'<button class="btn" id="smp" style="margin-left:8px">Add 6 sample products</button>'}</div>
  <table style="margin-top:16px"><tr><th></th><th>Product</th><th>Price ₹</th><th>Stock</th><th>Wt (g)</th><th></th></tr>${S.products.map(p=>`<tr><td><img src="${esc(p.imageUrl||ph(p.name))}" style="width:44px;height:44px;border-radius:8px;object-fit:cover"></td><td>${esc(p.name)}<div class="mut">${esc(p.category||"")}</div></td><td><input type="number" value="${p.price/100}" data-p="${p.id}" style="width:90px;margin:0"></td><td><input type="number" value="${p.stock}" data-s="${p.id}" style="width:70px;margin:0"></td><td><input type="number" value="${p.weight||0}" data-w="${p.id}" style="width:80px;margin:0"></td><td><button class="btn d" data-x="${p.id}">Delete</button></td></tr>`).join("")}</table>`;
  $("#add").onclick=async()=>{const n=$("#pn").value.trim(),pr=Math.round(+$("#pp").value*100),e=$("#pe");if(!n||!pr)return e.textContent="Enter a name and price.";
    $("#add").disabled=true;try{const f=$("#pf").files[0];await addDoc(collection(db,"products"),{name:n,price:pr,stock:+$("#ps").value||0,weight:+$("#pw").value||0,category:$("#pc").value.trim(),imageUrl:f?await shrink(f):"",createdAt:serverTimestamp()});aProducts()}catch{e.textContent="Could not add. Check the rules are published.";$("#add").disabled=false}};
  $("#smp")&&($("#smp").onclick=async()=>{$("#smp").disabled=true;for(const[n,c,p,st,w]of SAMPLES)await addDoc(collection(db,"products"),{name:n,category:c,price:p,stock:st,weight:w,imageUrl:"",createdAt:serverTimestamp()});aProducts()});
  document.querySelectorAll("[data-s]").forEach(i=>i.onchange=()=>updateDoc(doc(db,"products",i.dataset.s),{stock:+i.value||0}));
  document.querySelectorAll("[data-w]").forEach(i=>i.onchange=()=>updateDoc(doc(db,"products",i.dataset.w),{weight:+i.value||0}));
  document.querySelectorAll("[data-p]").forEach(i=>i.onchange=()=>updateDoc(doc(db,"products",i.dataset.p),{price:Math.round(+i.value*100)}));
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?")){await deleteDoc(doc(db,"products",b.dataset.x));aProducts()}})}
async function aCoupons(){
  const snap=await getDocs(collection(db,"coupons")),rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $("#ab").innerHTML=`<div class="panel"><h3>Create discount coupon</h3><p class="mut" style="margin:4px 0 12px">Create a code and choose the percentage customers will save.</p><label class="mut" for="cc">Coupon code</label><input id="cc" placeholder="e.g. SAVE20 (leave empty to auto-generate)" style="text-transform:uppercase"><div class="row2"><div style="flex:1;min-width:130px"><label class="mut" for="cpc">Discount percentage</label><select id="cpc"><option value="10">10% off</option><option value="20" selected>20% off</option><option value="30">30% off</option><option value="40">40% off</option></select></div><div style="flex:1;min-width:130px"><label class="mut" for="cmu">Maximum uses</label><input id="cmu" type="number" min="0" step="1" placeholder="0 = unlimited" value="0" style="margin-top:10px"></div></div><p class="err" id="ce"></p><button class="btn p" id="cg">＋ Create coupon</button></div>
  <div class="row" style="justify-content:space-between;margin:20px 0 10px"><h3 style="margin:0">Coupons</h3><span class="tag">${rows.length} total</span></div><table><tr><th>Coupon code</th><th>Discount</th><th>Usage</th><th>Status / Actions</th></tr>${rows.map(c=>`<tr><td class="mono">${esc(c.code)}</td><td><span class="tag">${c.percent}% OFF</span></td><td>${c.used||0}${c.maxUses?" / "+c.maxUses:" / Unlimited"}</td><td><div class="row"><button class="btn" data-ct="${esc(c.code)}" data-v="${c.active?0:1}">${c.active?"Disable":"Enable"}</button><button class="btn d" data-cd="${esc(c.code)}">Delete</button></div></td></tr>`).join("")||'<tr><td colspan="4" class="mut">No coupons created yet.</td></tr>'}</table>`;
  $("#cg").onclick=async()=>{const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",pc=Number($("#cpc").value),e=$("#ce"),btn=$("#cg");let code=$("#cc").value.trim().toUpperCase();
    if(!code)code=[...crypto.getRandomValues(new Uint32Array(6))].map(x=>A[x%A.length]).join("");
    if(!/^[A-Z0-9_-]{3,20}$/.test(code))return e.textContent="Use 3–20 letters, numbers, _ or - for the coupon code.";
    if(![10,20,30,40].includes(pc))return e.textContent="Choose a discount of 10%, 20%, 30% or 40%.";
    if((await getDoc(doc(db,"coupons",code))).exists())return e.textContent="This coupon code already exists.";
    btn.disabled=true;try{await setDoc(doc(db,"coupons",code),{code,percent:pc,maxUses:Math.max(0,Math.floor(Number($("#cmu").value)||0)),used:0,active:true,createdAt:serverTimestamp()});await aCoupons()}catch(err){e.textContent="Could not create coupon. Check your admin access and try again.";btn.disabled=false}};
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,"coupons",b.dataset.ct),{active:b.dataset.v==="1"});aCoupons()}catch(e){alert("Could not update coupon status.")}});
  document.querySelectorAll("[data-cd]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this coupon?")){try{await deleteDoc(doc(db,"coupons",b.dataset.cd));aCoupons()}catch(e){alert("Could not delete coupon.")}}})}
async function aDelivery(){
  const sn=await getDoc(doc(db,"settings","delivery")),d={shopPincode:"141001",slabs:[{km:50,charge:100,extra:30},{km:100,charge:150,extra:50},{km:200,charge:250,extra:80}],beyond:400,beyondExtra:120,fallback:200,freeAbove:0,...(sn.exists()?sn.data():{})};
  $("#ab").innerHTML=`<div class="panel"><h3>Delivery charges</h3><p class="mut">Charge = price for the first 1 kg (by distance) + extra for each additional kg. Weight is rounded up to full kg. Distance is estimated from the customer's pincode.</p>
  <label class="mut">Your shop pincode</label><input id="dp" inputmode="numeric" maxlength="6" value="${esc(d.shopPincode)}">
  <label class="mut">Slabs: up to km = price for first kg / extra ₹ per additional kg</label><input id="ds" value="${esc([...d.slabs].sort((a,b)=>a.km-b.km).map(x=>x.km+"="+x.charge+"/"+(x.extra||0)).join(", "))}">
  <label class="mut">Beyond the last slab: ₹ for first kg</label><input id="db" type="number" value="${d.beyond}">
  <label class="mut">Beyond the last slab: extra ₹ per additional kg</label><input id="dx" type="number" value="${d.beyondExtra||0}">
  <label class="mut">₹ if distance can't be found (first kg)</label><input id="df" type="number" value="${d.fallback}">
  <label class="mut">Free delivery above order value ₹ (0 = off)</label><input id="da" type="number" value="${d.freeAbove}">
  <p class="err" id="de"></p><button class="btn p" id="dsv">Save</button></div>`;
  $("#dsv").onclick=async()=>{const sl=$("#ds").value.split(",").map(x=>{const[k,r]=x.trim().split("="),[ch,ex]=(r||"").split("/");return{km:+k,charge:+ch,extra:+(ex||0)}}).filter(x=>x.km>0&&x.charge>=0&&x.extra>=0),pin=$("#dp").value.trim();
    if(!/^[1-9]\d{5}$/.test(pin)||!sl.length)return $("#de").textContent="Enter a valid pincode and slabs like 50=100/30, 100=150/50.";
    await setDoc(doc(db,"settings","delivery"),{shopPincode:pin,slabs:sl,beyond:+$("#db").value||0,beyondExtra:+$("#dx").value||0,fallback:+$("#df").value||0,freeAbove:+$("#da").value||0});$("#de").textContent="Saved.";$("#de").style.color="var(--g)"}}
async function aAdmins(){
  const snap=await getDocs(collection(db,"admins")),rows=snap.docs.map(d=>d.id);
  $("#ab").innerHTML=`<div class="panel"><h3>Admins</h3><p class="mut">Owner: ${esc(ADMINS.join(", "))}</p><div class="row"><input id="ae" type="email" placeholder="new-admin@gmail.com" style="margin:0;max-width:280px"><button class="btn p" id="aa">Make admin</button></div><p class="err" id="ar"></p></div>
  <table style="margin-top:14px">${rows.map(e=>`<tr><td>${esc(e)}</td><td><button class="btn d" data-r="${esc(e)}">Remove</button></td></tr>`).join("")||'<tr><td class="mut">No extra admins yet.</td></tr>'}</table>`;
  $("#aa").onclick=async()=>{const e=$("#ae").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return $("#ar").textContent="Enter a valid email.";await setDoc(doc(db,"admins",e),{email:e,addedBy:S.user.email,createdAt:serverTimestamp()});aAdmins()};
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"admins",b.dataset.r));aAdmins()})}
</script></body></html>
