<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0c10;--panel:#14161c;--line:#262a33;--text:#f4f5f7;--mut:#9aa0ad;--y:#f5ff3d;--g:#55f09a;--r:#ff667d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'DM Sans',system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:#0b0c10ee;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}
.top b{font-size:17px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#1b1e26;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.p{background:var(--y);color:#111;border-color:var(--y)}.btn.d{color:var(--r)}.btn:disabled{opacity:.45}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:380px}
.card h2{margin:0 0 8px}.mut{color:var(--mut)}.err{color:var(--r);margin:10px 0 0;min-height:18px}
input{width:100%;background:#0e1015;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;background:#1b1e26;display:block}
.prod div{padding:12px}.price{font-weight:700;color:var(--y)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#1b1e26}.in{color:var(--g)}.out{color:var(--r)}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.tabs .btn.on{background:var(--y);color:#111}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:20}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:15;padding:18px;overflow:auto}
.hide{display:none!important}.mono{font-family:ui-monospace,monospace;letter-spacing:.06em}

.logo{font-family:'Space Grotesk';font-size:20px;letter-spacing:-.03em}.logo span{color:var(--y)}
body{background:radial-gradient(700px 400px at 10% -10%,#f5ff3d14,transparent 60%),var(--bg)}
.hero{padding:34px 0 8px}.hero h1{font:700 clamp(26px,6vw,42px)/1.1 'Space Grotesk';margin:0 0 10px;letter-spacing:-.03em}
.hero input{margin-top:14px;padding:14px;border-radius:14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:8px 15px;font-weight:600}.chip.on{background:var(--y);color:#111;border-color:var(--y)}
.prod{transition:.15s}.prod:hover{border-color:#4a4f5c}.pb{padding:12px!important;display:flex;flex-direction:column;gap:5px}.pn{font-weight:600;line-height:1.25;min-height:2.5em}.sm{font-size:12px}.price{font-size:18px}
.step{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.step .btn{padding:8px 16px}
.bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9;background:#1b1e26;border:1px solid #3a3f4b;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:auto;box-shadow:0 12px 40px #000a}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:520px}.panel h3{margin:0 0 4px}.row2{display:flex;gap:8px}
label.mut{display:block;margin-top:12px;font-size:13px}input[type=file]{padding:10px}

/* ===== Animations & button polish ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{text-shadow:0 0 0 #f5ff3d00}50%{text-shadow:0 0 18px #f5ff3d66}}
.logo span{animation:glow 3s ease-in-out infinite}
.card{animation:fadeUp .5s ease both}
.hero{animation:fadeUp .5s ease both}
.prod{animation:fadeUp .45s ease both}
.prod:nth-child(2){animation-delay:.05s}.prod:nth-child(3){animation-delay:.1s}.prod:nth-child(4){animation-delay:.15s}.prod:nth-child(5){animation-delay:.2s}.prod:nth-child(6){animation-delay:.25s}.prod:nth-child(n+7){animation-delay:.3s}
.prod:hover{transform:translateY(-4px);box-shadow:0 14px 34px #000a;border-color:#f5ff3d66}
.prod img{transition:transform .35s ease}.prod:hover img{transform:scale(1.05)}
.prod{overflow:hidden}
.drawer{animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
.modal{animation:fadeIn .2s ease}
.bar{animation:slideUp .35s ease both}
.panel,.tabs,table{animation:fadeUp .35s ease both}
.btn{position:relative;overflow:hidden;border-radius:12px;padding:11px 16px;letter-spacing:.01em;
  background:linear-gradient(180deg,#232733,#1a1d25);border:1px solid #333948;
  transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:#4a5163;box-shadow:0 8px 20px #0009}
.btn:active:not(:disabled){transform:translateY(0) scale(.96);box-shadow:none}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;

 $("#g").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code!=="auth/popup-closed-by-user")$(".err").textContent="Login failed. Try again."}}}

function banned(){root.innerHTML=`<div class="center"><div class="card" style="text-align:center"><h2 style="color:var(--r)">Your account has been suspended</h2><p class="mut">${esc(S.user.email)} can't place orders. Contact us to resolve this.</p><button class="btn" id="o">Sign out</button></div></div>`;$("#o").onclick=()=>signOut(auth)}

function codeModal(){root.innerHTML=`<div class="modal"><form class="card" id="f"><h2>Enter your shop code</h2><p class="mut">Signed in as ${esc(S.user.email)}. The code links to this Google account permanently and works once.</p>
<input id="c" class="mono" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" style="text-align:center;font-size:18px"><p class="err" id="e"></p>
<button class="btn p" id="s" style="width:100%">Verify code</button><button type="button" class="btn" id="o" style="width:100%;margin-top:8px">Use a different account</button></form></div>`;
 $("#o").onclick=()=>signOut(auth);
 $("#c").oninput=e=>{let v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);e.target.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v};
 $("#f").onsubmit=async e=>{e.preventDefault();const code=$("#c").value,err=$("#e");if(code.length<9)return err.textContent="Enter the full 8-character code.";
  $("#s").disabled=true;err.textContent="";
  try{const ref=doc(db,"shopCodes",code),snap=await getDoc(ref);
   if(!snap.exists())throw"This shop code doesn't exist.";
   if(snap.data().status!=="unused")throw"This code has already been used.";
   const b=writeBatch(db);
   b.update(ref,{status:"used",usedBy:S.user.uid,usedByEmail:S.user.email,usedAt:serverTimestamp()});
   b.set(doc(db,"users",S.user.uid),{uid:S.user.uid,email:S.user.email,displayName:S.user.displayName||"",shopCode:code,is_verified:true,is_banned:false,createdAt:serverTimestamp()});
   await b.commit();
  }catch(x){err.textContent=typeof x==="string"?x:"Could not verify. Try again.";$("#s").disabled=false}}}

async function loadProducts(){const s=await getDocs(collection(db,"products"));S.products=s.docs.map(d=>({id:d.id,...d.data()}))}
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);

const ph=n=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='#1b1e26'/><text x='100' y='122' font-size='62' text-anchor='middle' fill='#f5ff3d' font-family='sans-serif' font-weight='700'>${esc((n||"?").slice(0,2).toUpperCase())}</text></svg>`);

Store</button><button class="btn nv" id="vo">📦 Orders</button><button class="btn cartb" id="tc">🛒 Cart<i id="tcn"></i></button><button class="btn out" id="o">Sign out</button></div></div><div class="wrap" id="main"></div><div id="bar"></div><div id="dr"></div>`;
  $("#o").onclick=()=>signOut(auth);$("#tc").onclick=cart;$("#vo").onclick=()=>{S.view="orders";render()};$("#vs").onclick=()=>{S.view="store";render()};isAdmin()&&($("#va").onclick=()=>{S.view="admin";render()});render()}
function render(){if(S.view!=="orders"&&S.ou){S.ou();S.ou=null}
  S.view==="admin"&&isAdmin()?admin():S.view==="orders"?myOrders():store();bar();
  const ad=S.view==="admin"&&isAdmin();$("#vs")&&$("#vs").classList.toggle("on",!ad&&S.view!=="orders");$("#vo")&&$("#vo").classList.toggle("on",S.view==="orders");$("#va")&&$("#va").classList.toggle("on",ad)}
function bar(){const n=cartCount(),t=Object.entries(S.cart).reduce((a,[id,q])=>a+q*(S.products.find(p=>p.id===id)?.price||0),0),on=n&&S.view==="store";const tcn=$("#tcn");if(tcn){tcn.textContent=n||"";tcn.classList.toggle("on",!!n);tcn.classList.remove("bump");void tcn.offsetWidth;tcn.classList.add("bump")}
  $("#bar").innerHTML=on?`<div class="bar"><div><b>${n} item${n>1?"s":""}</b><div class="mut">${rs(t)}</div></div><button class="btn p" id="vc">View cart</button></div>`:"";on&&($("#vc").onclick=cart)}
function store(){
  const cats=[...new Set(S.products.map(p=>p.category).filter(Boolean))];
  $("#main").innerHTML=`<div class="hero"><span class="pill">⚡ Wholesale rates · Registered shops only</span><h1>Genuine mobile spare parts,<br>wholesale rates</h1><p class="mut" style="margin:0">Displays, batteries, ports and more. Pay online and we arrange delivery.</p><input id="q" placeholder="Search parts…" value="${esc(S.q||"")}"></div>
  <div class="chips">${["All",...cats].map(c=>`<button class="chip ${(S.cat||"All")===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="gr"></div>`;
  $("#q").oninput=e=>{S.q=e.target.value;grid()};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;store()});grid()}
function grid(){
  const q=(S.q||"").toLowerCase(),c=S.cat&&S.cat!=="All"?S.cat:null,L=S.products.filter(p=>(!c||p.category===c)&&(!q||p.name.toLowerCase().includes(q)));
  $("#gr").innerHTML=L.length?`<div class="grid">${L.map(p=>{const n=S.cart[p.id]||0;return `<div class="prod"><img src="${esc(p.imageUrl||ph(p.name))}" alt="" loading="lazy"><div class="pb">${p.category?`<span class="tag" style="align-self:flex-start">${esc(p.category)}</span>`:""}<div class="pn">${esc(p.name)}</div><div class="price">${rs(p.price)}</div><div class="${p.stock>0?"in":"out"} sm">${p.stock>0?"In stock":"Out of stock"}</div>${p.stock<=0?'<button class="btn" disabled>Unavailable</button>':n?`<div class="step"><button class="btn" data-gm="${p.id}">−</button><b>${n}</b><button class="btn" data-gp="${p.id}">+</button></div>`:`<button class="btn p" data-ga="${p.id}">＋ Add to cart</button>`}</div></div>`}).join("")}</div>`:`<p class="mut" style="margin:30px 0">${S.products.length?"No parts match your search.":"No products yet."+(isAdmin()?" Open Admin → Products to add some.":"")}</p>`;
  document.querySelectorAll("[data-ga],[data-gp]").forEach(b=>b.onclick=()=>{const id=b.dataset.ga||b.dataset.gp,p=S.products.find(x=>x.id===id);if((S.cart[id]||0)<p.stock)S.cart[id]=(S.cart[id]||0)+1;grid();bar()});
  document.querySelectorAll("[data-gm]").forEach(b=>b.onclick=()=>{const id=b.dataset.gm;S.cart[id]--;if(S.cart[id]<1)delete S.cart[id];grid();bar()})}

function cart(){
  const items=Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id===id),q})).filter(i=>i.p),total=items.reduce((a,i)=>a+i.p.price*i.q,0);
  $("#dr").innerHTML=`<div class="bd" id="bd"></div><div class="drawer"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Your cart</h2><button class="btn x" id="x" aria-label="Close">✕</button></div>
  ${items.length?items.map(i=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div>${esc(i.p.name)}<div class="mut">${rs(i.p.price)} × ${i.q}</div></div><div class="row"><button class="btn" data-m="${i.p.id}">−</button><button class="btn" data-pl="${i.p.id}">+</button></div></div>`).join("")+`
  <h3>Total ${rs(total)}</h3><p class="mut">Delivery details (shipping is arranged offline)</p>
  <input id="n" placeholder="Contact name"><input id="ph" placeholder="Phone" inputmode="tel"><input id="ad" placeholder="Full address"><input id="ci" placeholder="City"><input id="pi" placeholder="Pincode" inputmode="numeric">
  <p class="err" id="e"></p><button class="btn p" id="pay" style="width:100%">Pay ${rs(total)}</button>`:'<p class="mut">Your cart is empty.</p>'}</div>`;
  $("#x").onclick=()=>$("#dr").innerHTML="";$("#bd").onclick=()=>$("#dr").innerHTML="";
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const id=b.dataset.m;S.cart[id]--;if(S.cart[id]<1)delete S.cart[id];render();cart()});
  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{const id=b.dataset.pl,p=S.products.find(x=>x.id===id);if(S.cart[id]<p.stock)S.cart[id]++;render();cart()});
  items.length&&($("#pay").onclick=async()=>{
    const sh={name:$("#n").value.trim(),phone:$("#ph").value.trim(),address:$("#ad").value.trim(),city:$("#ci").value.trim(),pincode:$("#pi").value.trim()};
    if(Object.values(sh).some(v=>!v))return $("#e").textContent="Fill in all delivery details.";
    $("#pay").disabled=true;
    try{const ref=await addDoc(collection(db,"orders"),{userId:S.user.uid,email:S.user.email,shopCode:S.profile?.shopCode||"ADMIN",items:items.map(i=>({productId:i.p.id,name:i.p.name,price:i.p.price,qty:i.q})),amount:total,paymentStatus:"PENDING",shipping:sh,createdAt:serverTimestamp()});
     new Razorpay({key:RAZORPAY_KEY,amount:total,currency:"INR",name:"Display Wallah",description:"Order "+ref.id.slice(0,6),prefill:{name:sh.name,email:S.user.email,contact:sh.phone},theme:{color:"#f5ff3d"},
      handler:async r=>{await updateDoc(ref,{paymentStatus:"PAID",razorpayPaymentId:r.razorpay_payment_id,paidAt:serverTimestamp()});S.cart={};render();$("#dr").innerHTML='<div class="drawer"><h2>Payment received</h2><p class="mut">Your order is confirmed. We will arrange delivery.</p><button class="btn" id="x">Close</button></div>';$("#x").onclick=()=>$("#dr").innerHTML=""},
      modal:{ondismiss:()=>{$("#pay").disabled=false}}}).open();
    }catch{$("#e").textContent="Could not start payment. Try again.";$("#pay").disabled=false}})}

function admin(){
  const T=[["products","Products"],["codes","Shop codes"],["users","Users"],["orders","Orders"],...(isOwner()?[["admins","Admins"]]:[])];
  $("#main").innerHTML=`<div class="tabs">${T.map(t=>`<button class="btn ${S.tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div><div id="ab" class="scroll">Loading…</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;admin()});
  ({codes:aCodes,users:aUsers,orders:aOrders,products:aProducts,admins:aAdmins})[S.tab]()}

const when=t=>t?.toDate?t.toDate().toLocaleString("en-IN"):"";
async function aCodes(){
  const snap=await getDocs(collection(db,"shopCodes")),rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $("#ab").innerHTML=`<div class="row"><input id="cn" type="number" min="1" max="50" value="1" style="width:90px;margin:0"><input id="nt" placeholder="Note (shop name)" style="max-width:240px;margin:0"><button class="btn p" id="gen">Generate</button></div>
  <table style="margin-top:14px"><tr><th>Code</th><th>Status</th><th>Used by</th><th></th></tr>${rows.map(c=>`<tr><td class="mono">${esc(c.code)}<div class="mut">${esc(c.note||"")}</div></td><td>${c.status}</td><td>${esc(c.usedByEmail||"")}</td><td><button class="btn" data-cp="${esc(c.code)}">Copy</button></td></tr>`).join("")}</table>`;
  $("#gen").onclick=async()=>{const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",n=Math.min(Math.max(+$("#cn").value||1,1),50);$("#gen").disabled=true;
   for(let i=0;i<n;i++){const r=crypto.getRandomValues(new Uint32Array(8)),s=[...r].map(x=>A[x%A.length]).join(""),code=s.slice(0,4)+"-"+s.slice(4);
    await setDoc(doc(db,"shopCodes",code),{code,status:"unused",note:$("#nt").value.trim(),createdAt:serverTimestamp(),usedBy:null,usedByEmail:null,usedAt:null})}aCodes()};
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.cp);b.textContent="Copied"})}

async function aUsers(){
  const snap=await getDocs(collection(db,"users")),rows=snap.docs.map(d=>d.data());
  $("#ab").innerHTML=`<table><tr><th>User</th><th>Shop code</th><th>Status</th><th></th></tr>${rows.map(u=>`<tr><td>${esc(u.displayName)}<div class="mut">${esc(u.email)}</div></td><td class="mono">${esc(u.shopCode)}</td><td class="${u.is_banned?"out":"in"}">${u.is_banned?"Banned":"Active"}</td>
  <td><button class="btn ${u.is_banned?"":"d"}" data-b="${u.uid}" data-v="${u.is_banned?0:1}">${u.is_banned?"Unban":"Ban"}</button></td></tr>`).join("")}</table>`;
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.b),{is_banned:b.dataset.v==="1"});aUsers()})}

const STEPS=[["placed","Order Placed"],["packed","Packed"],["shipped","Shipped"],["out","Out for Delivery"],["delivered","Delivered"]],COURIERS=["Porter","Shiprocket","Delhivery","DTDC","Bluedart","Other"];

function myOrders(){
  $("#main").innerHTML=`<div class="hero"><h1>My orders</h1><p class="mut" style="margin:0">Live delivery status of your orders.</p></div><div id="ol"><p class="mut" style="margin:24px 0">Loading…</p></div>`;
  S.ou&&S.ou();
  S.ou=onSnapshot(query(collection(db,"orders"),where("userId","==",S.user.uid)),sn=>{
    if(S.view!=="orders")return;const rows=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("#ol").innerHTML=rows.length?rows.map(oCard).join(""):'<p class="mut" style="margin:24px 0">No orders yet. Place your first order from the Store.</p>'},
    ()=>{$("#ol")&&($("#ol").innerHTML='<p class="err">Could not load orders.</p>')})}
function oCard(o){
  const paid=o.paymentStatus==="PAID",ix=Math.max(0,STEPS.findIndex(x=>x[0]===o.deliveryStatus)),url=/^https?:\/\//i.test(o.trackingUrl||"")?o.trackingUrl:"";
  return `<div class="ocard"><div class="row" style="justify-content:space-between"><div><b>Order #${esc(o.id.slice(0,6).toUpperCase())}</b><div class="mut sm">${when(o.createdAt)}</div></div><div style="text-align:right"><b class="price">${rs(o.amount)}</b><div class="sm ${paid?"in":"out"}">${paid?"Paid":"Payment pending"}</div></div></div>
  <div class="mut" style="margin:10px 0">${(o.items||[]).map(i=>esc(i.name)+" ×"+i.qty).join(" · ")}</div>
  ${paid?`<div class="tl">${STEPS.map((x,i)=>`<div class="st ${i<ix||ix===4?"done":i===ix?"cur":""}"><i>${i<ix||ix===4?"✓":i+1}</i><span>${x[1]}</span></div>`).join("")}</div>
  ${o.courier||o.trackingId||url?`<div class="trk"><div>${o.courier?"🚚 "+esc(o.courier):""}${o.trackingId?` · <span class="mono">${esc(o.trackingId)}</span>`:""}</div>${url?`<a class="btn p" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Track on courier site</a>`:""}</div>`:""}`:`<p class="mut sm" style="margin:0">Delivery tracking starts after payment is confirmed.</p>`}</div>`}
async function aOrders(){
  const snap=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc"))),rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  $("#ab").innerHTML=rows.length?`<div class="scroll"><table><tr><th>Order</th><th>Items</th><th>Total</th><th>Payment</th><th>Ship to</th><th>Delivery &amp; tracking</th></tr>${rows.map(o=>{const paid=o.paymentStatus==="PAID",cs=o.courier||"";return `<tr data-o="${o.id}"><td>${o.id.slice(0,6)}<div class="mut">${when(o.createdAt)}</div><div class="mut mono">${esc(o.shopCode)}</div></td><td>${o.items.map(i=>esc(i.name)+" ×"+i.qty).join("<br>")}</td><td>${rs(o.amount)}</td>
  <td class="${paid?"in":"out"}">${o.paymentStatus}<div class="mut">${esc(o.razorpayPaymentId||"")}</div></td><td>${esc(o.shipping.name)}, ${esc(o.shipping.phone)}<br>${esc(o.shipping.address)}, ${esc(o.shipping.city)} ${esc(o.shipping.pincode)}</td>
  <td style="min-width:210px">${paid?`<select class="ds">${STEPS.map(x=>`<option value="${x[0]}" ${(o.deliveryStatus||"placed")===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><select class="dc"><option value="">Courier…</option>${COURIERS.map(c=>`<option ${cs===c?"selected":""}>${c}</option>`).join("")}</select><input class="dt" placeholder="Tracking / AWB no." value="${esc(o.trackingId||"")}"><input class="du" placeholder="Tracking link (https://…)" value="${esc(o.trackingUrl||"")}"><button class="btn p sv" style="width:100%;margin-top:6px">Save update</button>`:'<span class="mut">Waiting for payment</span>'}</td></tr>`}).join("")}</table></div>`:'<p class="mut">No orders yet.</p>';
  document.querySelectorAll(".sv").forEach(b=>b.onclick=async()=>{const tr=b.closest("tr"),u=tr.querySelector(".du").value.trim();
    if(u&&!/^https?:\/\//i.test(u))return alert("Tracking link must start with https://");
    b.disabled=true;try{await updateDoc(doc(db,"orders",tr.dataset.o),{deliveryStatus:tr.querySelector(".ds").value,courier:tr.querySelector(".dc").value,trackingId:tr.querySelector(".dt").value.trim(),trackingUrl:u,deliveryUpdatedAt:serverTimestamp()});b.textContent="Saved ✓"}catch{alert("Could not save. Check the rules are published.")}setTimeout(()=>{b.disabled=false;b.textContent="Save update"},1400)})}

const SAMPLES=[["iPhone 11 Display (OEM)","Displays",185000,20],["Samsung A12 Battery","Batteries",42000,50],["Type-C Charging Port Flex","Ports",9000,100],["Redmi Note 10 Back Glass","Back Glass",28000,30],["Tempered Glass 9H (pack of 10)","Accessories",15000,80],["Fast Charger 33W","Accessories",35000,40]];
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
async function aProducts(){
  await loadProducts();
  $("#ab").innerHTML=`<div class="panel"><h3>Add product</h3><input id="pn" placeholder="Product name"><div class="row2"><input id="pp" type="number" placeholder="Price ₹"><input id="ps" type="number" placeholder="Stock"></div><input id="pc" list="cl" placeholder="Category (e.g. Displays)"><datalist id="cl">${[...new Set(S.products.map(p=>p.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label class="mut">Photo from gallery (optional)</label><input id="pf" type="file" accept="image/*"><p class="err" id="pe"></p><button class="btn p" id="add">Add product</button>${S.products.length?"":'<button class="btn" id="smp" style="margin-left:8px">Add 6 sample products</button>'}</div>
  <table style="margin-top:16px"><tr><th></th><th>Product</th><th>Price ₹</th><th>Stock</th><th></th></tr>${S.products.map(p=>`<tr><td><img src="${esc(p.imageUrl||ph(p.name))}" style="width:44px;height:44px;border-radius:8px;object-fit:cover"></td><td>${esc(p.name)}<div class="mut">${esc(p.category||"")}</div></td><td><input type="number" value="${p.price/100}" data-p="${p.id}" style="width:90px;margin:0"></td><td><input type="number" value="${p.stock}" data-s="${p.id}" style="width:70px;margin:0"></td><td><button class="btn d" data-x="${p.id}">Delete</button></td></tr>`).join("")}</table>`;
  $("#add").onclick=async()=>{const n=$("#pn").value.trim(),pr=Math.round(+$("#pp").value*100),e=$("#pe");if(!n||!pr)return e.textContent="Enter a name and price.";
    $("#add").disabled=true;try{const f=$("#pf").files[0];await addDoc(collection(db,"products"),{name:n,price:pr,stock:+$("#ps").value||0,category:$("#pc").value.trim(),imageUrl:f?await shrink(f):"",createdAt:serverTimestamp()});aProducts()}catch{e.textContent="Could not add. Check the rules are published.";$("#add").disabled=false}};
  $("#smp")&&($("#smp").onclick=async()=>{$("#smp").disabled=true;for(const[n,c,p,st]of SAMPLES)await addDoc(collection(db,"products"),{name:n,category:c,price:p,stock:st,imageUrl:"",createdAt:serverTimestamp()});aProducts()});
  document.querySelectorAll("[data-s]").forEach(i=>i.onchange=()=>updateDoc(doc(db,"products",i.dataset.s),{stock:+i.value||0}));
  document.querySelectorAll("[data-p]").forEach(i=>i.onchange=()=>updateDoc(doc(db,"products",i.dataset.p),{price:Math.round(+i.value*100)}));
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?")){await deleteDoc(doc(db,"products",b.dataset.x));aProducts()}})}
