/* ---- My orders + tracking ---- */
.sm{font-size:12px}
.mo-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.mo-head h2{margin:0}
.mo-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;animation:moIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .2s,box-shadow .2s}
.mo-card:active{transform:scale(.985)}
.mo-top,.mo-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mo-items{margin:10px 0;color:var(--mut);font-size:13px;line-height:1.5}
.mo-badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#ffe9eb;color:var(--y);white-space:nowrap}.mo-badge.done{background:#dcf7e8;color:var(--g)}.mo-badge.wait{background:#fff4d6;color:#8a5a00}
.scan-note{margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff4d6;border:1px solid #f1d78a;color:#5c3d00;font-size:13px;line-height:1.55}
.wa-box{margin:16px 0;padding:14px;border:1px solid #bfe9d2;background:#effbf4;border-radius:14px;display:flex;flex-direction:column;gap:6px}.wa-btn{background:#25d366;border-color:#25d366;color:#fff;text-align:center;text-decoration:none;margin-top:6px}.wa-btn:hover{background:#1fb858;border-color:#1fb858}
.ct-card{max-width:520px}.ct-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.6}.ct-row:last-of-type{border-bottom:0}.ct-ic{font-size:22px;width:30px;text-align:center}.ct-row a{color:var(--y);font-weight:600;text-decoration:none;word-break:break-all}
@keyframes moIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.trk{position:relative;margin:24px 0 10px}
.trk-line{position:absolute;left:21px;top:23px;width:4px;height:calc(var(--n)*80px);background:var(--line);border-radius:4px;overflow:hidden}
.trk-fill{width:100%;height:0;background:linear-gradient(var(--y),#ff8a5c);border-radius:4px;animation:trkGrow var(--t) ease-out .15s forwards}
.trk.fin .trk-fill{background:linear-gradient(var(--g),#5fe3a1)}
@keyframes trkGrow{to{height:calc(var(--k)*80px)}}
.trk-step{position:relative;display:flex;gap:14px;align-items:flex-start;height:80px;opacity:0;animation:trkIn .5s ease-out var(--d) forwards}
.trk-step.todo{--o:.45}
@keyframes trkIn{from{opacity:0;transform:translateX(-14px)}to{opacity:var(--o,1);transform:none}}
.trk-dot{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--panel);border:3px solid var(--line);z-index:1}
.trk-step.todo .trk-dot span{filter:grayscale(1)}
.trk-step.done .trk-dot{border-color:var(--g);background:#dcf7e8;animation:trkPop .5s cubic-bezier(.3,1.6,.5,1) var(--d) both}
.trk-step.cur .trk-dot{border-color:var(--y);background:#fff;animation:trkPop .5s cubic-bezier(.3,1.6,.5,1) var(--d) both,trkPulse 1.6s ease-out calc(var(--d) + .5s) infinite}
.trk.fin .trk-step.cur .trk-dot{border-color:var(--g);background:#dcf7e8;animation:trkPop .5s cubic-bezier(.3,1.6,.5,1) var(--d) both,trkPulseG 1.8s ease-out calc(var(--d) + .5s) infinite}
.trk-step.cur .trk-dot span{display:inline-block;animation:trkBob 1s ease-in-out infinite}
.trk-txt{padding-top:4px}.trk-step.cur .trk-txt b{color:var(--y)}.trk.fin .trk-step.cur .trk-txt b{color:var(--g)}
@keyframes trkPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes trkPulse{0%{box-shadow:0 0 0 0 #e51e2a66}70%{box-shadow:0 0 0 14px #e51e2a00}100%{box-shadow:0 0 0 0 #e51e2a00}}
@keyframes trkPulseG{0%{box-shadow:0 0 0 0 #12834d66}70%{box-shadow:0 0 0 14px #12834d00}100%{box-shadow:0 0 0 0 #12834d00}}
@keyframes trkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mo-det{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:13px;line-height:1.6}.mo-det .r{display:flex;justify-content:space-between;gap:10px}

:root{--bg:#f6f6f9;--panel:#fff;--line:#e8e8ef;--text:#14151a;--mut:#6a6d78;--y:#e51e2a;--g:#0f9d58;--r:#d92d20;--sh:0 1px 2px #1014280a,0 10px 28px #1014280f}
body{background:var(--bg);color:var(--text)}body:before{display:none}
a{color:#c8101d}
input[type=checkbox]{accent-color:#e51e2a}
.top{background:#ffffffee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);box-shadow:none}
.btn{background:#fff;color:var(--text);border:1px solid #dcdce6;border-radius:12px;box-shadow:0 1px 2px #10142810;font-weight:600;transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:before{display:none}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px #10142814;border-color:#c9c9d6;background:#fff}
.btn:active:not(:disabled){transform:none;box-shadow:none}
.btn.p,.btn.p:hover:not(:disabled){background:linear-gradient(180deg,#f0303d,#c8101d);color:#fff;border-color:#c8101d;box-shadow:0 8px 20px #e51e2a33}
.btn.d{background:#fff1f2;color:#b4121e;border-color:#ffd3d7}
.tabs .btn.on,.chip.on{background:var(--text);color:#fff;border-color:var(--text);box-shadow:none}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.card:before{height:4px;background:linear-gradient(90deg,#e51e2a,#ff6b6b);animation:none;border:0}
input,select,textarea{background:#fff;border:1px solid #dcdce6;border-radius:12px;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:#e51e2a;box-shadow:0 0 0 4px #e51e2a1f;outline:none}
.hero{padding:34px 0 8px}
.hero h1{color:var(--text);font-weight:700;letter-spacing:-.035em}
.hero h1:after{width:56px;height:4px;border:0;border-radius:4px;background:#e51e2a;box-shadow:none}
.hero input{border-radius:14px;box-shadow:var(--sh);padding:15px 18px}
.chip{background:#fff;color:var(--text);border:1px solid #dcdce6;box-shadow:none;font-weight:600}
.chip:hover{border-color:#b9b9c8;transform:none;box-shadow:none}
.grid{gap:18px}
.prod{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden;animation:productEnter .5s backwards;animation-delay:calc(var(--i,0)*45ms);transition:transform .2s,box-shadow .2s}
.prod:hover{transform:translateY(-4px);box-shadow:0 14px 36px #1014281c;border-color:var(--line)}
.prod img{background:#f1f2f6;border:0}
.price{color:var(--text);font-weight:700}
.tag{background:#fff1f2;color:#b4121e;border:0;font-weight:600}
.in{color:#0f9d58;font-weight:600}.out{color:#d92d20;font-weight:600}
.bar{background:#14151a;color:#fff;border:0;border-radius:18px;box-shadow:0 14px 36px #14151a40}
.bar .mut{color:#ffb3b8}
.bar .btn.p{border-color:#ff5a66}
.drawer{background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 40px #1014281a}
.modal{background:#14151acc}
th{background:#f3f4f8;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
.dw-scroll{position:relative;margin:6px 0 0}
.dw-sticky{--p:0;--w:clamp(104px,min(32vw,27svh),176px);position:sticky;top:76px;z-index:1;height:calc(100vh - 92px);border-radius:28px;overflow:hidden;color:#fff;background:radial-gradient(70% 55% at 50% 38%,#e51e2a40,transparent 70%),linear-gradient(180deg,#171a24,#0b0d13);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 14px 16px;box-shadow:0 20px 50px #14151a33}
.dw-eyebrow{font:600 11px/1 'Space Grotesk',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#ffffffb0}
.dw-scene{flex:1;width:100%;display:grid;place-items:center;perspective:1100px;min-height:0}
.dw-phone{position:relative;width:var(--w);height:calc(var(--w)*2.05);transform-style:preserve-3d;transform:rotateX(calc(var(--p)*58deg)) rotateZ(calc(var(--p)*-34deg)) scale(calc(1 - var(--p)*.1));will-change:transform}
.dw-l{position:absolute;inset:0;border-radius:calc(var(--w)*.15);display:block;transform:translateZ(calc(var(--p)*var(--z) + var(--b)));box-shadow:0 10px 30px #00000055}
.dw-back{--z:-150px;--b:0px;background:linear-gradient(160deg,#f0303d,#8f0f18)}
.dw-back:before{content:"";position:absolute;left:9%;top:5%;width:38%;aspect-ratio:1;border-radius:30%;background:radial-gradient(circle at 50% 50%,#0b0d13 0 22%,#2a2d38 24% 40%,#0b0d13 42%);box-shadow:0 0 0 3px #ffffff30}
.dw-back:after{content:"DW";position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--w)*.22)/1 'Space Grotesk',sans-serif;letter-spacing:.06em;color:#ffffffd9}
.dw-board{--z:-70px;--b:.5px;background:linear-gradient(#222,#222) 18% 14%/34% 13% no-repeat,linear-gradient(#2d2f38,#2d2f38) 58% 38%/30% 11% no-repeat,linear-gradient(#222,#222) 20% 62%/42% 15% no-repeat,repeating-linear-gradient(90deg,#d9b44a30 0 2px,transparent 2px 10px),#0f6b4c}
.dw-batt{--z:0px;--b:1px;background:#cdd2da;border:calc(var(--w)*.04) solid #aeb4bf}
.dw-batt:before{content:"BATTERY";position:absolute;inset:16% 12% 12%;display:grid;place-items:center;border-radius:12px;background:linear-gradient(#eef1f4,#c3c9d2);color:#4b5160;font:700 calc(var(--w)*.09)/1 'Space Grotesk',sans-serif;letter-spacing:.14em}
.dw-disp{--z:75px;--b:1.5px;background:radial-gradient(120% 55% at 50% 0,#e51e2a66,transparent 70%),linear-gradient(#0b1020,#18264a);border:calc(var(--w)*.03) solid #0b0d13}
.dw-disp:before{content:"9:41";position:absolute;top:13%;left:0;right:0;text-align:center;font:700 calc(var(--w)*.3)/1 'Space Grotesk',sans-serif;color:#fff}
.dw-disp:after{content:"";position:absolute;top:3%;left:50%;width:26%;height:3.4%;transform:translateX(-50%);border-radius:99px;background:#000}
.dw-glass{--z:150px;--b:2px;background:linear-gradient(135deg,#ffffff38,#ffffff0a 42%,#ffffff26);border:1.5px solid #ffffff55;box-shadow:inset 0 0 18px #ffffff22}
.dw-hint{font-size:13px;color:#ffffffb8;opacity:clamp(0,calc(1 - var(--p)*7),1)}
.dw-labels{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:absolute;left:12px;right:12px;bottom:14px}
.dw-labels li{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;background:#ffffff1c;border:1px solid #ffffff2e;opacity:clamp(0,calc((var(--p) - .55 - var(--d,0))*4),1)}
.dw-labels li:nth-child(1){--d:0}.dw-labels li:nth-child(2){--d:.06}.dw-labels li:nth-child(3){--d:.12}.dw-labels li:nth-child(4){--d:.18}.dw-labels li:nth-child(5){--d:.24}
@supports (height:100svh){.dw-sticky{height:calc(100svh - 92px)}}
@media (max-width:520px){.grid{gap:12px}.card{border-radius:20px}.hero h1{font-size:clamp(30px,9vw,40px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

async function makeProfile(u,code){
  const b=writeBatch(db);
  if(code){const ref=doc(db,"shopCodes",code),s=await getDoc(ref);
    if(!s.exists())throw"This shop code doesn't exist.";
    if(s.data().status!=="unused")throw"This code has already been used.";
    b.update(ref,{status:"used",usedBy:u.uid,usedByEmail:u.email,usedAt:serverTimestamp()})}
  b.set(doc(db,"users",u.uid),{uid:u.uid,email:u.email,displayName:(u.displayName||"").slice(0,100),shopCode:code||"",type:code?"shop":"customer",is_verified:true,is_banned:false,createdAt:serverTimestamp()});
  await b.commit()}

function render(){S.view==="orders"?myOrders():S.view==="contact"?contact():S.view==="admin"&&isAdmin()?admin():store();bar();foot()}
function bar(){const n=cartCount(),t=Object.entries(S.cart).reduce((a,[id,q])=>a+q*sp(S.products.find(p=>p.id===id)?.price||0),0),on=n&&S.view==="store";
  $("#bar").innerHTML=on?`<div class="bar"><div><b>${n} item${n>1?"s":""}</b><div class="mut">${rs(t)}</div></div><button class="btn p" id="vc">View cart</button></div>`:"";on&&($("#vc").onclick=cart)}
const STAGE=`<section class="dw-scroll" id="dwScroll" aria-label="Phone parts animation"><div class="dw-sticky" id="dwStage"><div class="dw-eyebrow">Display Wallah</div><div class="dw-scene" aria-hidden="true"><div class="dw-phone"><i class="dw-l dw-back"></i><i class="dw-l dw-board"></i><i class="dw-l dw-batt"></i><i class="dw-l dw-disp"></i><i class="dw-l dw-glass"></i></div></div><div class="dw-hint">Scroll down to open the phone ↓</div><ul class="dw-labels"><li>Glass</li><li>Display</li><li>Battery</li><li>Mainboard</li><li>Back cover</li></ul></div></section>`;
let stageOn=false,stageTick=false;
function stageUpd(){stageTick=false;const w=document.getElementById("dwScroll"),s=document.getElementById("dwStage"),h=document.querySelector(".top");if(!w||!s)return;
  const H=(h?h.offsetHeight:60)+8,ih=innerHeight,sh=Math.max(300,ih-H-16),span=Math.round(ih*.85),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  s.style.top=H+"px";s.style.height=sh+"px";w.style.height=(sh+span)+"px";
  const r=w.getBoundingClientRect(),p=rm?0:Math.min(1,Math.max(0,(H-r.top)/span));s.style.setProperty("--p",p.toFixed(3))}
function initStage(){if(!stageOn){stageOn=true;const q=()=>{if(!stageTick){stageTick=true;requestAnimationFrame(stageUpd)}};addEventListener("scroll",q,{passive:true});addEventListener("resize",q)}stageUpd()}
function store(){
  const cats=[...new Set(S.products.map(p=>p.category).filter(Boolean))];
  $("#main").innerHTML=`${STAGE}<div class="hero"><h1>Mobile spare parts,<br>ordered online, delivered to you</h1><p class="mut" style="margin:0">Explore displays, batteries, charging ports and more — simple ordering on WhatsApp and delivery arranged for you.</p><div class="row" style="margin:12px 0"><button class="btn p" data-cta type="button">Shop now</button><a class="btn" href="tel:${SHOP_PHONE.replace(/[^+\d]/g,"")}" style="text-decoration:none">📞 Call us</a></div><input aria-label="Find displays, batteries, ports…" id="q" placeholder="Find displays, batteries, ports…" value="${esc(S.q||"")}"></div>
  <div class="chips">${["All",...cats].map(c=>`<button class="chip ${(S.cat||"All")===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="gr"></div>`;
  $("#q").oninput=e=>{S.q=e.target.value;grid()};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;store()});grid();initStage()}
function grid(){
  const q=(S.q||"").toLowerCase(),c=S.cat&&S.cat!=="All"?S.cat:null,L=S.products.filter(p=>(!c||p.category===c)&&(!q||p.name.toLowerCase().includes(q)));
  $("#gr").innerHTML=L.length?`<div class="grid">${L.map((p,i)=>{const n=S.cart[p.id]||0;return `<div class="prod" style="--i:${i}"><img src="${esc(p.imageUrl||ph(p.name))}" alt="${esc(p.name)}" loading="lazy"><div class="pb">${p.category?`<span class="tag" style="align-self:flex-start">${esc(p.category)}</span>`:""}<div class="pn">${esc(p.name)}</div>${priceHtml(p.price)}<div class="${p.stock>0?"in":"out"} sm">${p.stock>0?"In stock":"Out of stock"}</div>${p.stock<=0?'<button class="btn" disabled>Unavailable</button>':n?`<div class="step"><button class="btn" data-gm="${p.id}" aria-label="Decrease quantity">−</button><b>${n}</b><button class="btn" data-gp="${p.id}" aria-label="Increase quantity">+</button></div>`:`<button class="btn p" data-ga="${p.id}">Add to cart</button>`}</div></div>`}).join("")}</div>`:`<p class="mut" style="margin:30px 0">${S.products.length?"No parts match your search.":"No products yet."+(isAdmin()?" Open Admin → Products to add some.":"")}</p>`;
  document.querySelectorAll("[data-ga],[data-gp]").forEach(b=>b.onclick=()=>{const id=b.dataset.ga||b.dataset.gp,p=S.products.find(x=>x.id===id);if(!S.cart[id]&&Object.keys(S.cart).length>=8){alert("You can order up to 8 different products at once. Please place this order first, then order the rest.");return}if((S.cart[id]||0)<Math.min(p.stock,100))S.cart[id]=(S.cart[id]||0)+1;grid();bar()});
  document.querySelectorAll("[data-gm]").forEach(b=>b.onclick=()=>{const id=b.dataset.gm;S.cart[id]--;if(S.cart[id]<1)delete S.cart[id];grid();bar()})}

function cart(){S.sh=S.sh||{};
  const items=Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id===id),q})).filter(i=>i.p),total=items.reduce((a,i)=>a+sp(i.p.price)*i.q,0);
  $("#dr").innerHTML=`<div class="drawer"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Your cart</h2><button class="btn" id="x">Close</button></div>
  ${items.length?items.map(i=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div>${esc(i.p.name)}<div class="mut">${rs(sp(i.p.price))} × ${i.q}</div></div><div class="row"><button class="btn" data-m="${i.p.id}" aria-label="Decrease quantity">−</button><button class="btn" data-pl="${i.p.id}" aria-label="Increase quantity">+</button></div></div>`).join("")+`
  <div class="row" style="justify-content:space-between"><span class="mut">Items</span><span>${rs(total)}</span></div><div class="row" style="justify-content:space-between;margin-top:6px"><span class="mut">Delivery <span id="dk"></span></span><span id="dl">Share location</span></div><h3 style="display:flex;justify-content:space-between"><span>Total</span><span id="tt">${rs(total)}</span></h3><p class="mut">Delivery details (shipping is arranged offline)</p>
  <input aria-label="Contact name" id="n" maxlength="100" placeholder="Contact name" value="${esc(S.sh.n||"")}"><input aria-label="Phone" id="ph" placeholder="Phone" inputmode="tel" value="${esc(S.sh.ph||"")}"><input aria-label="Full address" id="ad" maxlength="400" placeholder="Full address" value="${esc(S.sh.ad||"")}"><input aria-label="City" id="ci" maxlength="100" placeholder="City" value="${esc(S.sh.ci||"")}"><input aria-label="Pincode (6 digits)" id="pi" placeholder="Pincode (6 digits)" inputmode="numeric" maxlength="6" value="${esc(S.sh.pi||"")}">
  <div id="lc" style="margin:12px 0 4px;padding:12px;border:1px solid var(--line);border-radius:14px"></div>
  <p class="mut" style="font-size:12.5px;margin:10px 0 0">We use your name, phone, address and location only to deliver and support your order. See our <a href="#" data-p="privacy">Privacy Policy</a>.</p>
  <input id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0">
  <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:13px;line-height:1.5;cursor:pointer"><input type="checkbox" id="tcons" style="width:18px;height:18px;margin:2px 0 0;flex:none" ${S.sh.terms?"checked":""}><span>I have checked that these parts match my phone model, and I accept the <a href="#" data-p="terms">Terms of Use</a>, <a href="#" data-p="refund">Refund &amp; Return Policy</a> and <a href="#" data-p="shipping">Shipping Policy</a>.</span></label>
  <p class="err" id="e"></p><button class="btn p" id="pay" style="width:100%">Send this to our WhatsApp · <span id="pt">${rs(total)}</span></button>`:'<p class="mut">Your cart is empty.</p>'}</div>`;
  $("#x").onclick=()=>$("#dr").innerHTML="";
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const id=b.dataset.m;S.cart[id]--;if(S.cart[id]<1)delete S.cart[id];render();cart()});
  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{const id=b.dataset.pl,p=S.products.find(x=>x.id===id);if(S.cart[id]<Math.min(p.stock,100))S.cart[id]++;render();cart()});
  if(items.length){
    ["n","ph","ad","ci","pi"].forEach(k=>$("#"+k).oninput=()=>{S.sh[k]=$("#"+k).value});
    $("#tcons").onchange=e=>{S.sh.terms=e.target.checked};
    let dq=null,tk=0;
    const upd=m=>{const ch=dq?dq.charge:0;
      $("#dl").textContent=m||(dq?(dq.noShop?"To be confirmed":dq.charge?rs(dq.charge):"FREE"):"Share location");
      $("#dk").textContent=dq&&dq.km?`(~${dq.km} km)`:"";
      const t=total+ch;$("#tt").textContent=rs(t);$("#pt").textContent=rs(t)};
    const getQ=async()=>{const my=++tk;if(!S.sh.loc){dq=null;upd();return}upd("Calculating…");
      try{const d=await quote(S.sh.loc,items,total);if(my===tk){dq=d;upd()}}
      catch(x){if(my===tk){dq=null;upd(typeof x==="string"?x:"Could not calculate")}}};
    const lc=$("#lc"),showLoc=(msg,bad)=>{const L=S.sh.loc;
      lc.innerHTML=`<b>📍 Exact location (required)</b><div class="mut" style="margin:4px 0 8px">Share your precise Google Maps location so delivery reaches the right place.</div>`
      +(L?`<iframe src="https://maps.google.com/maps?q=${L.lat},${L.lng}&z=17&output=embed" style="width:100%;height:170px;border:0;border-radius:10px" loading="lazy"></iframe>
        <div class="mut" style="margin:6px 0">✅ Location saved (accuracy ~${Math.round(L.acc)} m) · <a href="${mapsUrl(L.lat,L.lng)}" target="_blank" rel="noopener">Open in Google Maps</a></div>`:"")
      +`<label style="display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;font-size:13px;line-height:1.5;cursor:pointer"><input type="checkbox" id="lcons" style="width:18px;height:18px;margin:2px 0 0;flex:none" ${S.sh.consent?"checked":""}><span>I agree to share my exact location with ${SHOP_NAME} only to deliver this order, and I have read the <a href="#" data-p="privacy">Privacy Policy</a>.</span></label>
        <button class="btn" id="gl" type="button" style="width:100%">${L?"Update location":"📍 Use my exact location"}</button>
        <div id="lm" style="margin-top:8px;min-height:18px;${bad?"color:var(--r)":"color:var(--mut)"}">${msg||""}</div>`;
      $("#gl").onclick=getLoc;wirePol();
      $("#lcons").onchange=e=>{S.sh.consent=e.target.checked;if(!e.target.checked){S.sh.loc=null;showLoc("Location removed because consent was withdrawn.");getQ()}}};
    const getLoc=()=>{const b=$("#gl"),m=$("#lm");
      if(!S.sh.consent){m.style.color="var(--r)";m.textContent="Please tick the consent box first.";return}
      if(!navigator.geolocation){m.style.color="var(--r)";m.textContent="This browser can't share location. Please use Chrome on your phone.";return}
      b.disabled=true;m.style.color="var(--mut)";m.textContent="Getting your exact location… please tap Allow.";
      navigator.geolocation.getCurrentPosition(p=>{
        const acc=p.coords.accuracy||0;
        if(acc>MAX_ACC){showLoc(`Location is not precise enough (~${Math.round(acc)} m). Turn on GPS / high-accuracy location, step outside if needed, and try again.`,true);return}
        S.sh.loc={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc};showLoc();getQ()},
      er=>{showLoc(er.code===1?"Location permission denied. Allow location for this site in your browser settings, then tap again.":er.code===3?"Location timed out. Turn on GPS and try again.":"Could not get your location. Try again.",true)},
      {enableHighAccuracy:true,timeout:25000,maximumAge:0})};

  items.length&&($("#pay").onclick=async()=>{
    const sh={name:$("#n").value.trim(),phone:$("#ph").value.trim(),address:$("#ad").value.trim(),city:$("#ci").value.trim(),pincode:$("#pi").value.trim()};
    if($("#hp").value)return;
    if(items.length>8)return $("#e").textContent="Maximum 8 different products per order. Please remove some items.";
    if(Object.values(sh).some(v=>!v))return $("#e").textContent="Fill in all delivery details.";
    const E=m=>$("#e").textContent=m,ph=sh.phone.replace(/[\s+-]/g,"").replace(/^91(?=\d{10}$)/,"");
    if(sh.name.length<2||sh.name.length>100)return E("Enter your full name (up to 100 characters).");
    if(sh.city.length>100)return E("City name is too long.");
    if(sh.address.length>400)return E("Address is too long (max 400 characters).");
    if(!/^[6-9]\d{9}$/.test(ph))return E("Enter a valid 10-digit mobile number.");
    if(sh.address.length<10)return E("Enter a complete address (house/shop no., area, landmark).");
    if(!/^[1-9]\d{5}$/.test(sh.pincode))return E("Enter a valid 6-digit pincode.");
    let lo=0;try{lo=+localStorage.getItem("lastOrder")||0}catch{}
    if(Date.now()-lo<30000)return E("Please wait a few seconds before placing another order.");
    sh.phone=ph;
    const L=S.sh.loc;if(!L)return $("#e").textContent="Please share your exact Google Maps location (tap \"Use my exact location\").";
    if(!S.sh.consent)return $("#e").textContent="Please tick the location consent box.";
    if(!S.sh.terms)return $("#e").textContent="Please tick the box to accept the Terms, Refund and Shipping policies.";
    const e=$("#e"),btn=$("#pay");btn.disabled=true;e.textContent="";
    try{const q=await quote(L,items,total),amount=total+q.charge,
      o={userEmail:auth.currentUser.email||"",shopCode:(S.profile&&S.profile.shopCode)||"",
        items:items.map(i=>({name:i.p.name,price:sp(i.p.price),qty:i.q})),
        itemsTotal:total,shippingCharge:q.charge,amount,distanceKm:q.km||0,
        shipping:{...sh,mapsLink:mapsUrl(L.lat,L.lng)}},
      url="https://wa.me/"+WA_NUM+"?text="+encodeURIComponent(waMsg(o));
      btn.disabled=false;waDone(url);location.href=url;
    }catch(x){e.textContent=typeof x==="string"?x:"Could not prepare the order. Try again.";btn.disabled=false}})}

/* ---- My orders + tracking ---- */
const TR=[["placed","Order placed","🧾"],["packed","Packed","📦"],["shipped","Shipped","🚚"],["out_for_delivery","Out for delivery","🛵"],["delivered","Delivered","✅"]];
const dt=x=>x?(x.toDate?x.toDate():new Date(x)).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"";
async function moFetch(){
  const u=auth.currentUser,seen={},out=[];
  const rs_=await Promise.allSettled(["uid","userId"].map(f=>getDocs(query(collection(db,"orders"),where(f,"==",u.uid)))));
  if(rs_.every(r=>r.status==="rejected"))throw"Could not load your orders. Try again.";
  rs_.forEach(r=>r.status==="fulfilled"&&r.value.docs.forEach(d=>{if(!seen[d.id]){seen[d.id]=1;out.push({id:d.id,...d.data()})}}));
  S.mo=out.sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));return S.mo}
async function myOrders(){
  $("#main").innerHTML=`<div class="mo-head"><h2>My orders</h2><button class="btn" id="mr">Refresh</button></div><div id="mol"><p class="mut">Loading…</p></div>`;
  $("#mr").onclick=myOrders;

  catch(x){if(S.view==="orders"&&$("#mol"))$("#mol").innerHTML=`<p class="err">${esc(typeof x==="string"?x:"Could not load your orders. Try again.")}</p>`}}
function moList(){
  const L=S.mo||[];
  $("#mol").innerHTML=L.length?L.map((o,i)=>{const bd=payBadge(o);
    return `<div class="mo-card" data-oid="${esc(o.id)}" style="--i:${i}"><div class="mo-top"><div><b>Order #${esc(o.id.slice(0,6).toUpperCase())}</b><div class="mut sm">${dt(o.createdAt)}</div></div><span class="mo-badge ${bd.done?"done":bd.wait?"wait":""}">${bd.t}</span></div><div class="mo-items">${o.items.map(it=>esc(it.name)+" ×"+it.qty).join(", ")}</div><div class="mo-foot"><b>${rs(o.amount)}</b><span class="mut sm">Tap to track ›</span></div></div>`}).join(""):'<p class="mut">No orders yet. Your orders will appear here.</p>';
  document.querySelectorAll("[data-oid]").forEach(c=>c.onclick=()=>moTrack(c.dataset.oid))}
function moTrack(id){
  const o=(S.mo||[]).find(x=>x.id===id);if(!o)return;
  const k=Math.max(0,TR.findIndex(t=>t[0]===o.trackStatus)),n=TR.length-1,fin=k===n,T=Math.max(.6,k*.45),times=[o.paidAt||o.createdAt,o.packedAt,o.shippedAt,o.outAt,o.deliveredAt],sh=o.shipping||{};
  $("#dr").innerHTML=`<div class="drawer"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Track order</h2><button class="btn" id="x">Close</button></div>
  <div class="mut sm" style="margin-top:4px">Order #${esc(o.id.slice(0,6).toUpperCase())} · ${dt(o.createdAt)}</div>
  <div class="trk ${fin?"fin":""}" style="--k:${k};--n:${n};--t:${T}s"><div class="trk-line"><div class="trk-fill"></div></div>
  ${TR.map((t,j)=>`<div class="trk-step ${j<k?"done":j===k?"cur":"todo"}" style="--d:${j<=k?(k?j*(T/k):0):T+.1}s"><div class="trk-dot"><span>${t[2]}</span></div><div class="trk-txt"><b>${t[1]}</b><div class="mut sm">${j<=k?dt(times[j]):"Pending"}</div></div></div>`).join("")}</div>
  <div class="mo-det"><b>Items</b>${o.items.map(it=>`<div class="r"><span>${esc(it.name)} × ${it.qty}</span></div>`).join("")}
  <div class="r mut" style="margin-top:8px"><span>Items total</span><span>${rs(o.itemsTotal)}</span></div>${o.shippingCharge?`<div class="r mut"><span>Delivery</span><span>${rs(o.shippingCharge)}</span></div>`:""}<div class="r"><b>Total</b><b>${rs(o.amount)}</b></div>
  <div style="margin-top:12px"><b>Delivering to</b><div class="mut">${esc(sh.name||"")}${sh.phone?", "+esc(sh.phone):""}<br>${esc(sh.address||"")}, ${esc(sh.city||"")} ${esc(sh.pincode||"")}${sh.lat?`<br><a href="${mapsUrl(sh.lat,sh.lng)}" target="_blank" rel="noopener">📍 View on Google Maps</a>`:""}</div></div></div>
  <button class="btn" id="rf" style="margin-top:14px;width:100%">Refresh status</button></div>`;
  $("#x").onclick=()=>{$("#dr").innerHTML=""};
  $("#rf").onclick=async()=>{const b=$("#rf");b.disabled=true;b.textContent="Refreshing…";try{await moFetch();moTrack(id);S.view==="orders"&&$("#mol")&&moList()}catch(x){b.disabled=false;b.textContent="Could not refresh. Try again."}}}
const trkCell=o=>!o.trackStatus?'<span class="mut">—</span>':!isAdmin()?`<span class="mut">${esc((TR.find(t=>t[0]===(o.trackStatus||"placed"))||TR[0])[1])}</span>`:`<div class="trk-adm">${TR.map(t=>`<button class="btn ${(o.trackStatus||"placed")===t[0]?"p":""}" data-ot="${esc(o.id)}" data-os="${t[0]}">${t[1]}</button>`).join("")}</div>`;
const TF={packed:"packedAt",shipped:"shippedAt",out_for_delivery:"outAt",delivered:"deliveredAt"};
function wireTrk(){document.querySelectorAll("[data-ot]").forEach(b=>b.onclick=async()=>{
  if(!isAdmin())return alert("Only admins can change order status.");
  document.querySelectorAll("[data-ot]").forEach(x=>x.disabled=true);
  try{const st=b.dataset.os,k=TF[st],up={trackStatus:st};if(k&&!(await getDoc(doc(db,"orders",b.dataset.ot))).data()?.[k])up[k]=new Date().toISOString();await updateDoc(doc(db,"orders",b.dataset.ot),up)}
  catch(x){alert("Could not update the order status: "+(typeof x==="string"?x:(x&&(x.code||x.message))||""))}
  aOrders()})}
const SAMPLES=[["iPhone 11 Display","Displays",185000,20,200],["Samsung A12 Battery","Batteries",42000,50,60],["Type-C Charging Port Flex","Ports",9000,100,10],["Redmi Note 10 Back Glass","Back Glass",28000,30,40],["Tempered Glass 9H (pack of 10)","Accessories",15000,80,150],["Fast Charger 33W","Accessories",35000,40,120]];
